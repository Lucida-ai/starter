<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .options {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 14px;
        }
        
        .options a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .options a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        
        .new-user {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .new-user p {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .signup-btn {
            width: 100%;
            padding: 12px;
            background: #f0f0f0;
            color: #333;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .signup-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-header h2 {
            color: #333;
            font-size: 24px;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }
        
        .close-btn:hover {
            color: #333;
        }
        
        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-header">
            <h1>Student Portal</h1>
            <p>Login to your account</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="studentId">Student ID</label>
                <input type="text" id="studentId" name="studentId" placeholder="Enter your student ID" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="login-btn">Login</button>
            
            <div class="options">
                <a href="#" onclick="openForgotPasswordModal(event)">Forgot Password?</a>
            </div>
        </form>
        
        <div class="new-user">
            <p>New user?</p>
            <button class="signup-btn" onclick="openSignupModal(event)">Create New Account</button>
        </div>
    </div>
    
    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Reset Password</h2>
                <button class="close-btn" onclick="closeForgotPasswordModal()">&times;</button>
            </div>
            <div class="success-message" id="resetSuccessMessage">
                Password reset link has been sent to your email!
            </div>
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="resetStudentId">Student ID</label>
                    <input type="text" id="resetStudentId" name="resetStudentId" placeholder="Enter your student ID" required>
                </div>
                
                <div class="form-group">
                    <label for="resetEmail">Email Address</label>
                    <input type="email" id="resetEmail" name="resetEmail" placeholder="Enter your registered email" required>
                </div>
                
                <button type="submit" class="login-btn">Send Reset Link</button>
            </form>
        </div>
    </div>
    
    <!-- Sign Up Modal -->
    <div id="signupModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create Account</h2>
                <button class="close-btn" onclick="closeSignupModal()">&times;</button>
            </div>
            <div class="success-message" id="signupSuccessMessage">
                Account created successfully! You can now login.
            </div>
            <form id="signupForm">
                <div class="form-group">
                    <label for="newStudentId">Student ID</label>
                    <input type="text" id="newStudentId" name="newStudentId" placeholder="Enter your student ID" required>
                </div>
                
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="newPassword">Password</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Create a password" required>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                </div>
                
                <button type="submit" class="login-btn">Create Account</button>
            </form>
        </div>
    </div>
    
    <script>
        // Login Form
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const studentId = document.getElementById('studentId').value;
            const password = document.getElementById('password').value;
            console.log('Login attempt:', { studentId, password });
            alert('Login successful! (Demo mode)');
            this.reset();
        });
        
        // Forgot Password Modal
        function openForgotPasswordModal(e) {
            e.preventDefault();
            document.getElementById('forgotPasswordModal').classList.add('active');
            document.getElementById('resetSuccessMessage').classList.remove('show');
        }
        
        function closeForgotPasswordModal() {
            document.getElementById('forgotPasswordModal').classList.remove('active');
            document.getElementById('forgotPasswordForm').reset();
        }
        
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const studentId = document.getElementById('resetStudentId').value;
            const email = document.getElementById('resetEmail').value;
            console.log('Password reset request:', { studentId, email });
            document.getElementById('resetSuccessMessage').classList.add('show');
            setTimeout(() => {
                closeForgotPasswordModal();
            }, 2000);
        });
        
        // Sign Up Modal
        function openSignupModal(e) {
            e.preventDefault();
            document.getElementById('signupModal').classList.add('active');
            document.getElementById('signupSuccessMessage').classList.remove('show');
        }
        
        function closeSignupModal() {
            document.getElementById('signupModal').classList.remove('active');
            document.getElementById('signupForm').reset();
        }
        
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            
            if (password !== confirm) {
                alert('Passwords do not match!');
                return;
            }
            
            const formData = {
                studentId: document.getElementById('newStudentId').value,
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                password: password
            };
            
            console.log('New account created:', formData);
            document.getElementById('signupSuccessMessage').classList.add('show');
            setTimeout(() => {
                closeSignupModal();
            }, 2000);
        });
        
        // Close modal when clicking outside
        window.addEventListener('click', function(e) {
            const forgotModal = document.getElementById('forgotPasswordModal');
            const signupModal = document.getElementById('signupModal');
            
            if (e.target === forgotModal) {
                closeForgotPasswordModal();
            }
            if (e.target === signupModal) {
                closeSignupModal();
            }
        });
    </script>
</body>
</html>
